  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--text); font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
  #app { height: 100%; max-width: 1400px; margin: 0 auto; display: flex; background: var(--panel); }

  /* chat list (the property owner's phone) */
  aside { width: 400px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }
  aside { background: var(--panel); position: relative; }
  .top { height: 64px; padding: 0 8px 0 20px; display: flex; align-items: center; gap: 4px; flex: none; }
  .top h1 { font-size: 26px; margin: 0; flex: 1; font-weight: 700; color: var(--wa); letter-spacing: -.3px; }
  .top .icon { color: var(--text); }
  .search { margin: 4px 16px 10px; background: var(--search); border-radius: 26px; height: 52px; padding: 0 18px; display: flex; align-items: center; gap: 14px; flex: none; }
  .search svg { width: 22px; height: 22px; fill: none; stroke: var(--muted); stroke-width: 2; stroke-linecap: round; flex: none; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: none; color: var(--text); font: inherit; font-size: 16px; }
  .search input::placeholder { color: var(--muted); }
  .chips { display: flex; gap: 8px; padding: 0 16px 10px; flex: none; overflow-x: auto; }
  .chip { border: 1px solid var(--chipline); background: none; color: var(--muted); border-radius: 18px; padding: 6px 14px; font: inherit; font-size: 15px; cursor: pointer; white-space: nowrap; }
  .chip.on { background: var(--chipon); border-color: var(--chipon); color: var(--chiptext); font-weight: 600; }
  #chats { flex: 1; overflow-y: auto; padding-bottom: 84px; }
  .chat { display: flex; gap: 16px; padding: 0 16px; align-items: center; height: 76px; cursor: pointer; border: 0; background: none; width: 100%; text-align: left; color: inherit; font: inherit; }
  .chat:hover { background: var(--hover); }
  .chat.active { background: var(--active); }
  .avatar { width: 52px; height: 52px; border-radius: 50%; flex: none; display: grid; place-items: center; font-size: 26px; background: #dfe5e7; color: #fff; }
  @media (prefers-color-scheme: dark) { .avatar { background: #3b4a54; } }
  .chat .meta { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .name { flex: 1; font-size: 17px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .time { font-size: 12.5px; color: var(--muted); }
  .row .time.unread { color: var(--wa); font-weight: 600; }
  .preview { color: var(--muted); font-size: 15px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .preview.unread { color: var(--text); }
  .badge { background: var(--wa); color: #fff; font-size: 12px; font-weight: 600; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; display: grid; place-items: center; }
  .badge[hidden] { display: none; }
  .empty { padding: 40px 24px; text-align: center; color: var(--muted); }
  .fab { position: absolute; right: 18px; bottom: 90px; width: 58px; height: 58px; border-radius: 18px; background: var(--wa); color: #fff;
    display: grid; place-items: center; box-shadow: 0 3px 8px rgba(11,20,26,.3); pointer-events: none; }
  .fab svg, .nav svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .nav { display: flex; justify-content: space-around; padding: 10px 4px 12px; background: var(--panel); border-top: 1px solid var(--line); flex: none; }
  .nav div { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; color: var(--text); min-width: 72px; }
  .nav .pill { position: relative; width: 58px; height: 32px; border-radius: 16px; display: grid; place-items: center; }
  .nav .on .pill { background: var(--chipon); }
  .nav .on { font-weight: 700; }
  .nav .pill .badge { position: absolute; top: -6px; right: -2px; min-width: 20px; height: 20px; font-size: 11px; }

  /* conversation */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--wallpaper);
    background-image: var(--doodle); background-size: 300px 300px; }
  .head { background: var(--header); height: 59px; padding: 0 16px; display: flex; align-items: center; gap: 14px; flex: none; }
  .head .avatar { width: 40px; height: 40px; font-size: 20px; }
  .head .who { flex: 1; min-width: 0; }
  .head .icon { flex: none; margin-left: -6px; color: var(--muted); }
  main { position: relative; }
  /* voice call: full-screen over the tenant's chat while a call is on */
  #call { position: absolute; inset: 0; z-index: 10; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: var(--header); padding: 24px; text-align: center; }
  #call.on { display: flex; }
  #call .avatar { width: 96px; height: 96px; font-size: 48px; }
  #call .n { font-size: 22px; }
  #callStatus { color: var(--muted); font-size: 15px; min-height: 22px; }
  #callHeard { color: var(--text); font-size: 15px; min-height: 40px; max-width: 90%; }
  #callEnd { margin-top: 18px; border: 0; border-radius: 50%; width: 60px; height: 60px; background: var(--danger); color: #fff; cursor: pointer; display: grid; place-items: center; }
  #callEnd svg { width: 28px; height: 28px; fill: currentColor; transform: rotate(135deg); }
  #call.listening .avatar { box-shadow: 0 0 0 8px rgba(37, 211, 102, .35); }
  #callMin { position: absolute; top: 12px; left: 12px; border: 0; background: var(--panel); color: var(--text); border-radius: 20px; padding: 8px 14px; font: inherit; font-size: 14px; cursor: pointer; }
  #callVoice { color: var(--muted); font-size: 12px; }
  /* green bar shown under the header while a call carries on behind the chat */
  #callBar { display: none; flex: none; align-items: center; gap: 10px; background: var(--green); color: #fff; padding: 7px 16px; font-size: 14px; cursor: pointer; }
  #callBar.on { display: flex; }
  #callBar span { flex: 1; }
  #callBar button { border: 0; border-radius: 14px; background: rgba(255, 255, 255, .25); color: #fff; font: inherit; font-size: 13px; padding: 3px 12px; cursor: pointer; }
  /* the owner's phone: a WhatsApp-style incoming call, and a bar while the assistant takes the call */
  #incoming { position: fixed; inset: 0; z-index: 40; display: none; flex-direction: column; align-items: center; justify-content: space-between;
    background: #0b141a; color: #e9edef; padding: 72px 24px 56px; text-align: center; }
  #incoming.on { display: flex; }
  #incoming .lbl { font-size: 14px; color: #8696a0; }
  #incoming .who { font-size: 28px; margin-top: 6px; }
  #incoming .av { width: 120px; height: 120px; border-radius: 50%; background: #202c33; display: grid; place-items: center; font-size: 60px; margin: 28px auto 0; }
  #incoming .sub { color: #8696a0; font-size: 13px; max-width: 80%; }
  #incoming .btns { display: flex; gap: 72px; }
  #incoming .btns div { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; color: #8696a0; }
  #incoming button { width: 64px; height: 64px; border: 0; border-radius: 50%; color: #fff; cursor: pointer; display: grid; place-items: center; }
  #incoming button svg { width: 30px; height: 30px; fill: currentColor; }
  #incoming .acc { background: #25d366; animation: ring 1.2s infinite; }
  #incoming .dec { background: #f15c6d; } #incoming .dec svg { transform: rotate(135deg); }
  @keyframes ring { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  #liveCall { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 30; align-items: center; gap: 10px; background: var(--green); color: #fff; padding: 8px 16px; font-size: 14px; }
  #liveCall.on { display: flex; }
  #liveCall span { flex: 1; }
  #liveCall button { border: 0; border-radius: 14px; background: rgba(255, 255, 255, .25); color: #fff; font: inherit; font-size: 13px; padding: 3px 12px; cursor: pointer; }
  .head .who .n { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .head .who .s { font-size: 13px; color: var(--muted); }
  .head select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; }
  .back { display: none; border: 0; background: none; color: var(--muted); font-size: 24px; cursor: pointer; padding: 4px 8px 4px 0; line-height: 1; }
  #messages { flex: 1; overflow-y: auto; padding: 18px 8% 12px; display: flex; flex-direction: column; gap: 3px; }
  .msg { max-width: 65%; padding: 6px 7px 8px 9px; border-radius: 8px; box-shadow: var(--shadow); position: relative; word-wrap: break-word; overflow-wrap: anywhere; }
  .msg.in { background: var(--in); align-self: flex-start; border-top-left-radius: 0; }
  .msg.out { background: var(--out); align-self: flex-end; border-top-right-radius: 0; }
  .msg.sys { border-left: 3px solid var(--green); }
  .msg .lock { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .msg .subject { font-weight: 600; margin-bottom: 2px; }
  .msg .text { white-space: pre-wrap; }
  .msg img { display: block; max-width: 100%; max-height: 300px; border-radius: 6px; margin-bottom: 4px; }
  .msg .ts { float: right; margin: 6px 0 -4px 12px; font-size: 11px; color: var(--muted); }
  .msg.out .ts::after { content: " ✓✓"; color: #53bdeb; }
  .msg.has-actions { padding-bottom: 0; }
  .actions { margin: 8px -7px 0 -9px; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
  .actions button { border: 0; background: none; color: #027eb5; font: inherit; font-weight: 500; padding: 10px; cursor: pointer; border-top: 1px solid var(--line); }
  .actions button:first-child { border-top: 0; }
  .actions button:hover:not(:disabled) { background: var(--hover); }
  .actions button:disabled { color: var(--muted); cursor: default; opacity: .7; }
  .actions button.approve:not(:disabled) { color: var(--green); }
  .actions button.reject:not(:disabled) { color: var(--danger); }
  .system { align-self: center; background: var(--system); color: var(--system-text); font-size: 12.5px; padding: 5px 12px; border-radius: 8px; box-shadow: var(--shadow); margin: 8px 0; text-align: center; max-width: 80%; }
  .system.error { color: var(--danger); }
  .typing span { display: inline-block; width: 7px; height: 7px; margin: 0 1.5px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .25; } 30% { opacity: 1; } }

  /* composer: one rounded white bar, like WhatsApp Web: clip + sticker | field | mic (send arrow once there is something to send) */
  #composer { background: var(--header); padding: 8px 16px; display: flex; align-items: center; flex: none; }
  #composer .bar { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: var(--panel); border-radius: 24px;
    padding: 6px 12px; box-shadow: var(--shadow); }
  #composer .field { flex: 1; background: none; color: var(--text); border: 0; outline: 0; padding: 8px 4px; font: inherit; font-size: 15px; min-width: 0; }
  #composer .field::placeholder { color: var(--muted); }
  .icon { border: 0; background: none; color: var(--text); cursor: pointer; width: 36px; height: 36px; padding: 0; border-radius: 50%;
    display: grid; place-items: center; flex: none; }
  .icon svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon:hover:not(:disabled) { background: var(--hover); }
  .icon:disabled { opacity: .45; cursor: default; }
  .send .arrow { display: none; }
  .send:not(:disabled) .mic { display: none; }
  .send:not(:disabled) .arrow { display: block; stroke: var(--green); fill: var(--green); }
  .send:disabled .mic { display: block; }
  #preview { background: var(--header); padding: 10px 16px 0; display: none; align-items: flex-end; gap: 12px; flex: none; }
  #preview.show { display: flex; }
  #preview img { max-height: 120px; max-width: 60%; border-radius: 8px; box-shadow: var(--shadow); }
  #preview button { border: 0; background: none; color: var(--muted); cursor: pointer; font: inherit; }

  dialog { border: 0; border-radius: 12px; padding: 20px; background: var(--panel); color: var(--text); width: min(360px, 90vw); box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(11,20,26,.5); }
  dialog h2 { margin: 0 0 4px; font-size: 18px; font-weight: 600; }
  dialog p { margin: 0 0 14px; color: var(--muted); font-size: 13px; }
  dialog label { display: block; font-size: 12px; color: var(--green); margin: 10px 0 4px; font-weight: 600; }
  dialog input { width: 100%; border: 0; border-bottom: 2px solid var(--line); background: none; color: var(--text); font: inherit; padding: 6px 0; outline: 0; }
  dialog input:focus { border-color: var(--green); }
  dialog select { width: 100%; border: 0; border-bottom: 2px solid var(--line); background: none; color: var(--text); font: inherit; padding: 6px 0; outline: 0; }
  dialog select:focus { border-color: var(--green); }
  dialog select option { background: var(--panel); }
  dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
  dialog .btns button { border: 0; border-radius: 18px; padding: 8px 18px; font: inherit; font-weight: 500; cursor: pointer; background: none; color: var(--green); }
  dialog .btns button.primary { background: var(--green); color: #fff; }

  /* pop-up notification, like a phone's banner: shown when a message lands in a chat that isn't open */
  #toast { position: fixed; top: 10px; left: 10px; right: 10px; z-index: 20; display: flex; gap: 12px; align-items: center;
    background: var(--panel); color: var(--text); border-radius: 12px; padding: 10px 14px; cursor: pointer;
    box-shadow: 0 6px 24px rgba(11,20,26,.35); border-left: 4px solid var(--green);
    transform: translateY(-140%); opacity: 0; transition: transform .25s ease, opacity .25s ease; pointer-events: none; }
  #toast.show { transform: none; opacity: 1; pointer-events: auto; }
  #toast .avatar { width: 38px; height: 38px; font-size: 19px; }
  #toast .t { min-width: 0; flex: 1; }
  #toast .t b { display: block; font-size: 14px; }
  #toast .t span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }

  /* tenant and technician phones have one chat, with the owner: no list, no back button */
  body.single aside { display: none !important; }
  body.single .back { display: none !important; }
  /* the owner's phone with no chat open (wide screens): nothing to type into yet */
  body.nochat .head, body.nochat #composer, body.nochat #preview { display: none !important; }

  /* narrow screens (and every phone frame on the demo page): one pane at a time */

</style>

<script>
/* Which phone is this?  /phone?role=tenant | technician | owner.
   Messages are conversations between two people; the property owner (role "manager" in the
   API) is in every one. The tenant and technician see one chat, headed by the owner's name.
   The owner sees a list of chats, one per tenant plus the technician. */
const ROLE = { tenant: "tenant", technician: "technician", owner: "manager" }[new URLSearchParams(location.search).get("role")] || "tenant";
document.body.classList.add(ROLE === "manager" ? "owner" : "single");

const EMOJI = { tenant: "🧑", technician: "🔧", owner: "🏠" };
const S = {
  cfg: { owner_name: "Property Owner", technician_name: "Technician", tenants: {} },
  msgs: [], lastId: 0, loaded: false, epoch: 0, polling: false,
  awaiting: {},      // ticket_id -> the step it is paused on, or null
  unread: {},        // conversation -> count (owner's phone)
  open: null,        // conversation open on the owner's phone
  notes: [],         // client-side hints and errors, shown inside a chat
  typing: false, pending: null,
  unit: null,        // the tenant's unit, once they have told us (this page load only)
  base: null,        // newest message id when the page opened: older history is not shown
  ask: null,         // a photo waiting on the unit number: { file, text }
  local: [],         // messages of the unit question, which happen before a ticket exists
};
// Every page load is a fresh chat: nothing is remembered between refreshes (history stays in the
// database, but this page only shows what happens after it opened).
// The unit is remembered between refreshes (a contact knows who you are); the chat itself starts empty.
try { S.unit = localStorage.getItem("unitriage.unit") || null; } catch (_) {}
function saveUnit(u) { S.unit = u; try { u ? localStorage.setItem("unitriage.unit", u) : localStorage.removeItem("unitriage.unit"); } catch (_) {} }
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const fmtTime = (d) => d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
// A link from a message, as a same-origin path: works whatever host the link names.
const pathOf = (url) => { const u = new URL(url, location.href); return u.pathname + u.search; };
const tenantConv = (unit) => "tenant:tenant-" + unit;
// "12B", "unit 12b", "room no. 3A" -> "12B" / "3A"; null when there is no unit number to find.
function parseUnit(text) {
  const t = text.trim();
  const m = t.match(/\b\d{1,4}\s?[A-Za-z]?\b/) || (/^[A-Za-z0-9-]{1,8}$/.test(t) ? [t] : null);
  return m ? m[0].replace(/\s+/g, "").toUpperCase() : null;
}
// A unit the tenant states themselves: "room number 12B", "unit 3A", "flat 12 b", or a bare "12B".
function extractUnit(text) {
  const kw = text.match(/\b(?:unit|room|flat|apartment|apt|door|number|no\.?|#)\s*(?:number|no\.?|#|is|:|-)?\s*([0-9]{1,4}\s?[A-Za-z]?)\b/i);
  if (kw) return kw[1].replace(/\s+/g, "").toUpperCase();
  const bare = text.match(/\b([0-9]{1,3}[A-Za-z])\b/);
  return bare ? bare[1].toUpperCase() : null;
}
const BOT = "Maintenance assistant";
function localMsg(sender, body, attachments, keep = true) {
  const m = { id: -1, sender, recipient: sender === "tenant" ? "manager" : "tenant", conversation: currentConv(),
    ts: new Date(), body, subject: "", attachments: attachments || [], actions: [], ticket_id: null, keep };
  S.local.push(m); return m;
}
function assistantSays(text) { localMsg("manager", text); render(true); voiceSay(text); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  let data = null;
  try { data = await r.json(); } catch (_) {}
  if (!r.ok) {
    let d = data && data.detail;
    if (Array.isArray(d)) d = d.map((x) => x.msg).join("; ");
    throw new Error(d || `Request failed (${r.status})`);
  }
  return data;
}

/* ---------- which conversation is on screen ---------- */
function currentConv() {
  if (ROLE === "tenant") return S.unit ? tenantConv(S.unit) : "tenant:new";
  if (ROLE === "technician") return "technician";
  return S.open;
}
function addNote(text, error) { S.notes.push({ conv: currentConv(), text, error }); render(true); }

/* The owner's chat list: one chat per known tenant, the technician, and any other tenant who writes in. */
function chatEntries() {
  const entries = Object.entries(S.cfg.tenants).map(([unit, name]) =>
    ({ key: tenantConv(unit), name, sub: `Tenant · Unit ${unit}`, emoji: EMOJI.tenant }));
  entries.push({ key: "technician", name: S.cfg.technician_name, sub: "Technician", emoji: EMOJI.technician });
  const known = new Set(entries.map((e) => e.key));
  S.msgs.forEach((m) => {
    if (known.has(m.conversation)) return;
    known.add(m.conversation);
    const unit = m.conversation.replace(/^tenant:(tenant-)?/, "");
    entries.push({ key: m.conversation, name: "Unit " + unit, sub: "Tenant", emoji: EMOJI.tenant });
  });
  entries.forEach((e) => { const l = S.msgs.filter((m) => m.conversation === e.key); e.last = l[l.length - 1]; });
  return entries.sort((a, b) => (b.last ? +b.last.ts : -1) - (a.last ? +a.last.ts : -1));   // newest activity first
}

/* ---------- rendering ---------- */
function cleanBody(body) {
  // Approval links become buttons, so hide the raw URLs.
  return (body || "").replace(/https?:\/\/\S+/g, "").split("\n").filter((l) => !/^\s*(Approve|Reject):\s*$/.test(l)).join("\n").trim();
}
function previewText(m) {
  const t = cleanBody(m.body).replace(/\s+/g, " ") || m.subject;
  return (m.sender === ROLE ? "You: " : m.sender === "system" ? "🔒 " : "") + (m.attachments.length ? "📷 " : "") + t;
}
function actionEnabled(m, a) {
  const step = S.awaiting[m.ticket_id];
  if (a.kind === "quote") return step === "wait_for_quote";
  if (a.kind === "fixed" || a.kind === "not_fixed" || a.kind === "technician") return step === "wait_for_feedback";
  return step === "wait_for_approval";
}
function bubble(m, onImage) {
  const sys = m.sender === "system";
  const b = el("div", "msg " + (m.sender === ROLE ? "out" : "in") + (sys ? " sys" : ""));
  if (sys) b.appendChild(el("div", "lock", "🔒 Only visible to you"));
  (m.attachments || []).forEach((att) => {
    if (att.kind !== "image") return;
    const i = el("img"); i.src = att.src; i.alt = "Photo of the issue, sent by the tenant"; i.loading = "lazy";
    i.addEventListener("load", onImage);   // keep the newest message in view once the photo has loaded
    b.appendChild(i);
  });
  if (m.subject) b.appendChild(el("div", "subject", m.subject));
  const text = cleanBody(m.body);
  if (text) b.appendChild(el("span", "text", text));
  b.appendChild(el("span", "ts", fmtTime(m.ts)));
  // Buttons are only for the person the message was sent to.
  if (m.recipient === ROLE && m.actions && m.actions.length) {
    b.classList.add("has-actions");
    const box = el("div", "actions");
    m.actions.forEach((a) => {
      const btn = el("button", a.kind, a.label);
      btn.disabled = !actionEnabled(m, a);
      btn.addEventListener("click", () => handleAction(m, a, btn));
      box.appendChild(btn);
    });
    b.appendChild(box);
  }
  return b;
}
function render(forceScroll) {
  const box = $("messages"), conv = currentConv();
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.replaceChildren();
  const stick = forceScroll || atBottom;
  const list = S.msgs.filter((m) => m.conversation === conv)
    .concat(ROLE === "tenant" ? S.local : [])
    .sort((a, b) => a.ts - b.ts);
  if (!conv) box.appendChild(el("div", "system", "Select a chat to read the conversation."));
  else if (!list.length && !(ROLE === "tenant" && S.typing)) {
    const hint = ROLE === "tenant" ? "Send a photo of the problem to start a ticket."
      : ROLE === "technician" ? "Quote requests from the property owner will appear here."
      : "No messages in this chat yet.";
    box.appendChild(el("div", "system", hint));
  }
  list.forEach((m) => box.appendChild(bubble(m, () => { if (stick) box.scrollTop = box.scrollHeight; })));
  S.notes.filter((n) => n.conv === conv).forEach((n) => box.appendChild(el("div", "system" + (n.error ? " error" : ""), n.text)));
  if (ROLE === "tenant" && S.typing) { const t = el("div", "msg in typing"); t.append(el("span"), el("span"), el("span")); box.appendChild(t); }
  if (stick) box.scrollTop = box.scrollHeight;
  if (ROLE === "manager") renderList();
  renderHeader();
}
const LIST = { q: "", unreadOnly: false };
function renderList() {
  const box = $("chats"); box.replaceChildren();
  const all = chatEntries();
  const total = all.reduce((n, e) => n + (S.unread[e.key] || 0), 0);
  $("navBadge").textContent = String(total); $("navBadge").hidden = !total;
  $("fUnread").textContent = total ? "Unread " + total : "Unread";
  const q = LIST.q.trim().toLowerCase();
  const shown = all.filter((e) => (!LIST.unreadOnly || S.unread[e.key]) &&
    (!q || (e.name + " " + e.sub + " " + (e.last ? previewText(e.last) : "")).toLowerCase().includes(q)));

/* ---------- polling ---------- */
async function poll() {
  if (S.polling) return; S.polling = true;
  const epoch = S.epoch;
  try {
    if (S.base === null) {   // first run: note where the conversation stands, and start after it
      const all = await api("/api/demo/messages?" + new URLSearchParams({ after: 0, viewer: ROLE }));
      S.base = all.reduce((n, m) => Math.max(n, m.id), 0);
      S.lastId = S.base;
    }
    const q = new URLSearchParams({ after: S.lastId, viewer: ROLE });
    if (ROLE === "tenant") { if (!S.unit) { S.polling = false; return; } q.set("conversation", tenantConv(S.unit)); }
    const fresh = await api("/api/demo/messages?" + q);
    if (epoch !== S.epoch) return;   // the tenant switched unit while this was in flight
    const incoming = [];
    fresh.forEach((m) => {
      S.lastId = Math.max(S.lastId, m.id);
      const msg = { ...m, ts: new Date(m.ts), attachments: (m.attachments || []).map((a) => ({ ...a, src: pathOf(a.url) })) };
      S.msgs.push(msg);
      if (ROLE === "tenant" && m.sender === "manager" && m.recipient === "tenant") voiceSay(cleanBody(m.body));
      // A message from someone else, in a chat that is not open, is unread (not on first load).
      if (ROLE === "manager" && S.loaded && m.sender !== "manager" && m.conversation !== S.open) {
        S.unread[m.conversation] = (S.unread[m.conversation] || 0) + 1;
        incoming.push(msg);
      }
    });
    S.loaded = true;
    if (incoming.length) notify(incoming);
    // Which buttons are still live depends on where each ticket is paused.
    const ids = new Set();
    S.msgs.forEach((m) => { if (m.recipient === ROLE && m.actions && m.actions.length) ids.add(m.ticket_id); });
    let changed = fresh.length > 0;
    await Promise.all([...ids].map(async (id) => {
      try { const t = await api("/api/tickets/" + encodeURIComponent(id));
        if (S.awaiting[id] !== t.awaiting) { S.awaiting[id] = t.awaiting; changed = true; } } catch (_) {}
    }));
    if (changed && epoch === S.epoch) render(false);
  } catch (_) { /* server restarting; try again next tick */ }
  finally { S.polling = false; }
}

  if (!ticketId) {

      const history = S.msgs.filter((m) => m.conversation === currentConv() && m.body && m.sender !== "system").slice(-4)
        .map((m) => ({ sender: m.sender === "tenant" ? "tenant" : "manager", body: cleanBody(m.body).slice(0, 500) })).filter((m) => m.body);
      await api("/api/chat/reply", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ unit_id: S.unit, message: text, history }) });

  // What was said so far (without the photo bubble, which the ticket will carry) goes to the owner too.
  const said = S.local.filter((m) => m.body && !(m.attachments || []).length)
    .map((m) => ({ sender: m.sender === "tenant" ? "tenant" : "manager", body: m.body }));
  const held = S.ask;
  try {
    await postChat(unit, said);      // also checks the unit exists
  } catch (e) {
    if (/unknown unit/i.test(e.message)) assistantSays(`I couldn't find a unit "${unit}". Could you check the number and send it again?`);
    else addNote("Could not send: " + e.message, true);
    return;
  }
  S.local = []; S.ask = null; useUnit(unit);
  if (held && held.file) { await sendPhoto(held.file, held.text, unit); return; }
  try { await postChat(unit, [{ sender: "manager", body: `Thanks, I have you down for unit ${unit}. Please send a photo of the problem so I can assess it.` }]); } catch (_) {}
  render(true); await poll();
}

  const fd = new FormData();
  fd.append("image", f); fd.append("tenant_id", "tenant-" + unit); fd.append("unit_id", unit);
  fd.append("tenant_name", S.cfg.tenants[unit] || ""); fd.append("description", text);
  try {
    await api("/api/tickets/intake", { method: "POST", body: fd });
    S.local = []; useUnit(unit);
  } catch (e) {
    if (tentative && /unknown unit/i.test(e.message)) {   // they named a unit we don't have: ask again
      S.ask = { file: f, text };
      localMsg("tenant", text, [{ kind: "image", src: URL.createObjectURL(f) }], false);
      assistantSays(`I couldn't find a unit "${unit}". Which room or unit number is this for?`);
    } else addNote("Could not submit the photo: " + e.message, true);
  }
  finally { S.typing = false; render(true); await poll(); }

/* ---------- voice call (tenant <-> property owner only) ----------

   replies) and every reply is read aloud. The tenant's call shows on the owner's phone like a WhatsApp call. */
const VOICE = { on: false, live: false, min: false, id: 0, rec: null, speaking: 0, busy: false, wait: null, tick: null, watch: null, since: 0,

  const lang = (v) => v.lang.replace("_", "-").toLowerCase();
  const rank = (v) => (lang(v) === "en-in" ? 100 : lang(v).startsWith("en") ? 10 : 0)
    + (/natural|neural|online/i.test(v.name) ? 20 : 0) + (/google/i.test(v.name) ? 10 : 0) + (/female|neerja|heera|veena|kalpana/i.test(v.name) ? 5 : 0);

  const v = pickVoice();
  $("callVoice").textContent = v ? `Voice: ${v.name} (${v.lang})` + (/^en[-_]in$/i.test(v.lang) ? "" : " · no Indian English voice installed") : "No English voice found";
}
const mmss = (ms) => { const t = Math.floor(ms / 1000); return String(Math.floor(t / 60)).padStart(2, "0") + ":" + String(t % 60).padStart(2, "0"); };

  clearTimeout(VOICE.wait); VOICE.busy = false;

  VOICE.on = true; VOICE.live = false; VOICE.speaking = 0; VOICE.busy = false; VOICE.min = false;
  $("callAvatar").textContent = EMOJI.owner; $("callName").textContent = S.cfg.owner_name;
  $("callHeard").textContent = ""; $("call").classList.add("on"); showVoice(); callStatus("Calling…");
  if (VOICE.sarvam) {       // ask for the microphone now, while the tap that started the call still counts
    try { VOICE.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }); }
    catch (_) { endCall(false); addNote("Microphone is blocked. Allow it in the browser and try again.", true); return; }
  }
  let call;
  try { call = await callApi("start", { unit: S.unit, name: (S.unit && S.cfg.tenants[S.unit]) || (S.unit ? "Unit " + S.unit : "New tenant") }); }
  catch (e) { endCall(false); addNote("Could not place the call: " + e.message, true); return; }
  VOICE.id = call.id; callStatus("Ringing…");
  // The owner's phone rings. If they accept it connects at once; if they decline it stops;
  // otherwise the assistant answers on their behalf after a few seconds.
  for (let i = 0; i < 8 && VOICE.on; i++) {
    await sleep(500);
    let c = null; try { c = await api("/api/demo/call"); } catch (_) {}
    if (!c || c.id !== VOICE.id) continue;
    if (c.state === "active") break;
    if (c.state === "declined" || c.state === "ended") { callStatus("Call declined"); await sleep(1200); endCall(false); addNote("The property owner declined the call.", false); return; }
  }
  if (!VOICE.on) return;
  try { await callApi("answer"); } catch (_) {}
  VOICE.live = true; VOICE.since = Date.now(); callStatus("Connected");
  VOICE.tick = setInterval(() => { $("callBarText").textContent = "Ongoing voice call · " + mmss(Date.now() - VOICE.since); }, 1000);
  VOICE.watch = setInterval(async () => {          // the owner can hang up from their phone
    try { const c = await api("/api/demo/call"); if (c.id !== VOICE.id || c.state !== "active") endCall(false); } catch (_) {}
  }, 1500);
  assistantSays(S.unit ? "Hi, this is " + S.cfg.owner_name + "'s assistant. Tell me what's wrong, or send a photo."
                       : "Hi! Which room or unit number are you in?");
}
function endCall(notify = true) {
  const was = VOICE.on; VOICE.on = false; VOICE.live = false; VOICE.min = false; VOICE.gen++;
  if (VOICE.audio) { try { VOICE.audio.pause(); } catch (_) {} VOICE.audio = null; }
  if (VOICE.stream) { VOICE.stream.getTracks().forEach((t) => t.stop()); VOICE.stream = null; }
  clearTimeout(VOICE.wait); clearInterval(VOICE.tick); clearInterval(VOICE.watch); stopListening();
  if (window.speechSynthesis) speechSynthesis.cancel();
  $("call").classList.remove("on", "listening"); $("callBar").classList.remove("on");
  if (was && notify) callApi("end").catch(() => {});
}
if (ROLE === "tenant") {
  $("voiceCall").addEventListener("click", startCall);
  $("callEnd").addEventListener("click", () => endCall());
  $("callMin").addEventListener("click", () => setMin(true));
  $("callBar").addEventListener("click", () => setMin(false));
  $("callBarEnd").addEventListener("click", (e) => { e.stopPropagation(); endCall(); });
} else { $("voiceCall").tabIndex = -1; $("voiceCall").setAttribute("aria-hidden", "true"); }

/* ---------- the owner's phone: incoming call ---------- */
async function pollCall() {
  let c; try { c = await api("/api/demo/call"); } catch (_) { return; }
  const ringing = c.state === "ringing", active = c.state === "active";
  $("incoming").classList.toggle("on", ringing);
  $("liveCall").classList.toggle("on", active);
  if (ringing) {
    $("incName").textContent = c.name || "Tenant";
    $("incLine").textContent = c.unit ? "Unit " + c.unit + " · incoming voice call…" : "Incoming voice call…";
  }
  if (active) $("liveText").textContent = "🎙 On a call with " + (c.name || "Tenant") + " · the assistant is talking";
}
if (ROLE === "manager") {
  $("incAccept").addEventListener("click", async () => { try { await callApi("answer"); } catch (_) {} pollCall(); });
  $("incDecline").addEventListener("click", async () => { try { await callApi("decline"); } catch (_) {} pollCall(); });
  $("liveEnd").addEventListener("click", async () => { try { await callApi("end"); } catch (_) {} pollCall(); });
  setInterval(pollCall, 1000);
}

/* ---------- start ---------- */
if (ROLE !== "manager") document.body.classList.remove("nochat");
api("/api/demo/config").then((c) => { S.cfg = { ...S.cfg, ...c }; render(false); }).catch(() => {});
render(true); poll();
setInterval(poll, 1500); 
</script>
</body>
