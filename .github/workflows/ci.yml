name: CI

# Every push and pull request: unit and end-to-end tests, plus the offline guardrail and PII evals
# (no API keys, no network). A pull request cannot go green if a safety threshold is missed.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python evals/run_chat_eval.py
